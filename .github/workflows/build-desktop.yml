name: Build Desktop Apps (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name'
        required: false
        default: 'v1.0.0'
      release_name:
        description: 'Release Title'
        required: false
        default: 'Arcane Ledger Standalone Desktop Release'
      publish:
        description: 'Publish to GitHub Releases page'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: 'true'

jobs:
  build-windows:
    name: Build Windows Standalone App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pywebview pythonnet certifi

      - name: Package with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "ArcaneLedger" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "data;data" `
            --add-data "tools;tools" `
            --collect-all "webview" `
            --collect-all "certifi" `
            --hidden-import "app" `
            --hidden-import "updater" `
            --hidden-import "map_generator" `
            --hidden-import "fastapi" `
            --hidden-import "uvicorn" `
            --hidden-import "pydantic" `
            --hidden-import "qrcode" `
            --hidden-import "webview" `
            --hidden-import "webview.platforms.winforms" `
            --hidden-import "clr" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespans" `
            --hidden-import "uvicorn.lifespans.auto" `
            --icon "static/icon.ico" `
            desktop_launcher.py

      - name: Create Windows Distribution Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ArcaneLedger" -DestinationPath "ArcaneLedger-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneLedger-Windows-x64
          path: ArcaneLedger-Windows-x64.zip

  build-macos:
    name: Build macOS Standalone App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pywebview pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-WebKit certifi

      - name: Package with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "ArcaneLedger" \
            --osx-bundle-identifier "com.arcaneledger.app" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --add-data "data:data" \
            --add-data "tools:tools" \
            --collect-all "webview" \
            --collect-all "certifi" \
            --hidden-import "app" \
            --hidden-import "updater" \
            --hidden-import "map_generator" \
            --hidden-import "fastapi" \
            --hidden-import "uvicorn" \
            --hidden-import "pydantic" \
            --hidden-import "qrcode" \
            --hidden-import "objc" \
            --hidden-import "Foundation" \
            --hidden-import "AppKit" \
            --hidden-import "WebKit" \
            --hidden-import "webview" \
            --hidden-import "webview.platforms.cocoa" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespans" \
            --hidden-import "uvicorn.lifespans.auto" \
            --icon "static/icon.icns" \
            desktop_launcher.py

      - name: Configure macOS App Info.plist
        run: |
          python3 -c "import plistlib; p='dist/ArcaneLedger.app/Contents/Info.plist'; pl=plistlib.load(open(p,'rb')); pl['CFBundleDisplayName']='Arcane Ledger'; pl['CFBundleName']='Arcane Ledger'; pl['NSHighResolutionCapable']=True; plistlib.dump(pl,open(p,'wb'))"

      - name: Create macOS Distribution Zip
        run: |
          chmod -R +x dist/ArcaneLedger.app/Contents/MacOS/
          ditto -c -k --keepParent dist/ArcaneLedger.app ArcaneLedger-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneLedger-macOS
          path: ArcaneLedger-macOS.zip

  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ArcaneLedger-Windows-x64

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ArcaneLedger-macOS

      - name: Generate Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          TAG_NAME="${{ github.ref_name }}"
          echo "## What's Changed in ${TAG_NAME}" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            echo "### Improvements & Fixes:" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME}" >> release_notes.md
          else
            echo "### Improvements & Fixes:" >> release_notes.md
            git log -n 30 --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name != '' && github.event.inputs.tag_name || 'v1.0.0') }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || (github.ref_type == 'tag' && format('Arcane Ledger {0}', github.ref_name) || 'Arcane Ledger Standalone Desktop Release') }}
          body_path: release_notes.md
          files: |
            ArcaneLedger-Windows-x64.zip
            ArcaneLedger-macOS.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-nightly') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.event.inputs.tag_name, '-beta') || contains(github.event.inputs.tag_name, '-nightly') || contains(github.event.inputs.tag_name, '-rc') }}


