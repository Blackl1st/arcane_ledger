name: Build Desktop Apps (Windows & macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Standalone App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "ArcaneLedger" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "data;data" `
            --add-data "tools;tools" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespans" `
            --hidden-import "uvicorn.lifespans.auto" `
            desktop_launcher.py

      - name: Create Windows Distribution Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ArcaneLedger" -DestinationPath "ArcaneLedger-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneLedger-Windows-x64
          path: ArcaneLedger-Windows-x64.zip

  build-macos:
    name: Build macOS Standalone App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "ArcaneLedger" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --add-data "data:data" \
            --add-data "tools:tools" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespans" \
            --hidden-import "uvicorn.lifespans.auto" \
            desktop_launcher.py

      - name: Create macOS Distribution Zip
        run: |
          cd dist
          zip -r ../ArcaneLedger-macOS.zip ArcaneLedger.app ArcaneLedger 2>/dev/null || zip -r ../ArcaneLedger-macOS.zip .
          cd ..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneLedger-macOS
          path: ArcaneLedger-macOS.zip

  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ArcaneLedger-Windows-x64

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ArcaneLedger-macOS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ArcaneLedger-Windows-x64.zip
            ArcaneLedger-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
