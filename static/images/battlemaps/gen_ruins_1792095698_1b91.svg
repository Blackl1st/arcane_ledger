<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 1750" width="2500" height="1750">
<defs>
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="propShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="waterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
</defs>
  <!-- Weathered Ruins Ground -->
  <rect width="2500" height="1750" fill="#1c1f1c"/>

  <!-- Collapsed Ruin Sanctuary Walls -->
  <rect x="100" y="583" width="833" height="50" fill="#3f3f46" stroke="#18181b" stroke-width="3"/>
  <rect x="1567" y="583" width="833" height="50" fill="#3f3f46" stroke="#18181b" stroke-width="3"/>
  <rect x="100" y="1166" width="833" height="50" fill="#3f3f46" stroke="#18181b" stroke-width="3"/>
  <!-- Standing & Toppled Marble Columns (Cover) -->
  <g filter="url(#propShadow)">

    <rect x="1888" y="280" width="110" height="35" rx="4" fill="#3f3f46" stroke="#18181b" stroke-width="2" transform="rotate(60 1938 296)"/>

    <circle cx="2063" cy="1303" r="22" fill="#52525b" stroke="#27272a" stroke-width="3"/>
    <circle cx="2063" cy="1303" r="14" fill="#71717a"/>

    <circle cx="1067" cy="1272" r="22" fill="#52525b" stroke="#27272a" stroke-width="3"/>
    <circle cx="1067" cy="1272" r="14" fill="#71717a"/>

    <rect x="1249" y="976" width="110" height="35" rx="4" fill="#3f3f46" stroke="#18181b" stroke-width="2" transform="rotate(44 1299 992)"/>

    <circle cx="202" cy="518" r="22" fill="#52525b" stroke="#27272a" stroke-width="3"/>
    <circle cx="202" cy="518" r="14" fill="#71717a"/>

    <circle cx="1392" cy="189" r="22" fill="#52525b" stroke="#27272a" stroke-width="3"/>
    <circle cx="1392" cy="189" r="14" fill="#71717a"/>

    <rect x="227" y="637" width="110" height="35" rx="4" fill="#3f3f46" stroke="#18181b" stroke-width="2" transform="rotate(68 277 653)"/>

    <circle cx="791" cy="1567" r="22" fill="#52525b" stroke="#27272a" stroke-width="3"/>
    <circle cx="791" cy="1567" r="14" fill="#71717a"/>

    <circle cx="868" cy="401" r="22" fill="#52525b" stroke="#27272a" stroke-width="3"/>
    <circle cx="868" cy="401" r="14" fill="#71717a"/>

    <rect x="1747" y="469" width="110" height="35" rx="4" fill="#3f3f46" stroke="#18181b" stroke-width="2" transform="rotate(69 1797 485)"/>
  </g>

  <!-- Ancient Altar -->
  <g filter="url(#propShadow)">
    <rect x="1100" y="775" width="300" height="200" rx="6" fill="#3f3f46" stroke="#18181b" stroke-width="3"/>
    <rect x="1175" y="825" width="150" height="100" rx="3" fill="#18181b" stroke="#4b5563" stroke-width="2"/>
  </g>

  <!-- Daylight Ambient Sunbeams -->
  <linearGradient id="sunbeam" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fef08a" stop-opacity="0.08"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
  </linearGradient>
  <rect width="2500" height="1750" fill="url(#sunbeam)" pointer-events="none"/>
</svg>