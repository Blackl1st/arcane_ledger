<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#151d28" />
      <stop offset="70%" stop-color="#0c1219" />
      <stop offset="100%" stop-color="#05080c" />
    </radialGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#fcd34d" stroke-width="1.2" stroke-opacity="0.18" />
    </pattern>
  </defs>

  <rect width="3840" height="2160" fill="url(#vignette)" />
  <rect width="3840" height="2160" fill="url(#grid)" />

  <!-- Outer Ornate Border -->
  <rect x="60" y="60" width="3720" height="2040" fill="none" stroke="#fcd34d" stroke-width="3" stroke-opacity="0.35" />
  <rect x="80" y="80" width="3680" height="2000" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.6" />

  <!-- Central Schematic HUD Box -->
  <g transform="translate(1920, 1080)" text-anchor="middle">
    <rect x="-700" y="-280" width="1400" height="560" rx="24" fill="#090d13" stroke="#78350f" stroke-width="3" opacity="0.94" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.8))" />
    
    <text y="-180" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#fcd34d" letter-spacing="6">CURSE OF STRAHD • TACTICAL BATTLEMAP SLOT</text>
    <text y="-80" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#ffffff" letter-spacing="2">The Wizard of Wines Winery</text>
    <text y="-10" font-family="sans-serif" font-size="28" font-mono="true" fill="#94a3b8" letter-spacing="3">Chapter 12 • 5-Foot Tactical Grid (70px / square)</text>

    <!-- Divider Line -->
    <line x1="-500" y1="40" x2="500" y2="40" stroke="#fcd34d" stroke-width="1.5" stroke-opacity="0.4" />

    <text y="90" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#cbd5e1">Fermentation Vats, Loading Dock, Wine Cellar</text>
    <text y="170" font-family="sans-serif" font-size="22" font-mono="true" fill="#fcd34d">Drop DM Andy 4K JPG or Mike Schley image to deploy instant visual battlemap</text>
    <text y="210" font-family="sans-serif" font-size="18" font-mono="true" fill="#64748b">File target: static/images/battlemaps/cos/wizard_of_wines.jpg</text>
  </g>
</svg>