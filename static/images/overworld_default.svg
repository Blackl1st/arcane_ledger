<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="parchmentGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8d8b9" />
      <stop offset="65%" stop-color="#d2ba91" />
      <stop offset="100%" stop-color="#a88b5e" />
    </radialGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a4c" />
      <stop offset="50%" stop-color="#162b38" />
      <stop offset="100%" stop-color="#0d1b24" />
    </linearGradient>
    <pattern id="hexGrid" width="80" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 40 0 L 20 34.641 L 40 69.282 L 80 69.282 M 0 34.641 L 20 34.641" fill="none" stroke="#5c4728" stroke-width="0.7" stroke-opacity="0.22" />
    </pattern>
    <filter id="coastShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#081218" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Deep Sea Background -->
  <rect width="1600" height="1000" fill="url(#seaGrad)" />

  <!-- Sea Wave Lines & Cartography Rhumb Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1">
    <line x1="220" y1="780" x2="1500" y2="100" />
    <line x1="220" y1="780" x2="1550" y2="600" />
    <line x1="220" y1="780" x2="800" y2="50" />
    <line x1="220" y1="780" x2="100" y2="100" />
    <line x1="220" y1="780" x2="1200" y2="950" />
    <circle cx="220" cy="780" r="140" fill="none" />
    <circle cx="220" cy="780" r="280" fill="none" stroke-dasharray="6,6" />
  </g>

  <!-- Main Continent / Regional Landmass -->
  <path d="M 80,60 
           L 1520,60 
           L 1540,720 
           C 1450,740 1360,700 1280,740
           C 1180,790 1150,860 1030,870
           C 910,880 860,800 760,790
           C 670,780 640,860 540,850
           C 450,840 420,720 360,670
           C 300,620 220,610 170,540
           C 120,470 190,390 150,310
           C 110,230 60,150 80,60 Z" 
        fill="url(#parchmentGrad)" stroke="#4a3720" stroke-width="4" filter="url(#coastShadow)" />

  <!-- Southern Archipelago Islands -->
  <path d="M 420,890 C 460,875 510,895 525,925 C 500,955 440,950 410,925 Z" fill="url(#parchmentGrad)" stroke="#4a3720" stroke-width="2.5" />
  <path d="M 570,920 C 595,910 620,925 615,945 C 595,955 570,945 570,920 Z" fill="url(#parchmentGrad)" stroke="#4a3720" stroke-width="2" />
  <path d="M 290,740 C 320,730 345,755 335,785 C 310,795 280,775 290,740 Z" fill="url(#parchmentGrad)" stroke="#4a3720" stroke-width="2" />

  <!-- Subtle Hex Overlay over Land & Sea -->
  <rect width="1600" height="1000" fill="url(#hexGrid)" />

  <!-- Highland Biome Shading (Northern Ironpeaks & Eastern Moors) -->
  <path d="M 220,90 C 550,80 950,90 1450,110 C 1480,260 1350,360 1120,330 C 850,300 500,260 220,210 Z" fill="#8c7048" fill-opacity="0.22" />
  <!-- Whispering Woods Biome Shading -->
  <path d="M 480,310 C 680,280 860,340 910,470 C 940,560 810,630 640,600 C 490,570 430,420 480,310 Z" fill="#3f6212" fill-opacity="0.18" />
  <!-- Sunken Marsh Biome Shading -->
  <path d="M 720,660 C 860,650 980,710 1020,810 C 930,855 810,810 730,770 Z" fill="#115e59" fill-opacity="0.2" />

  <!-- Major Rivers -->
  <g fill="none" stroke="#2563eb" stroke-opacity="0.55" stroke-linecap="round">
    <!-- Silvervein River -->
    <path d="M 780,160 C 760,250 710,310 690,410 C 670,510 590,580 530,680 C 490,740 460,790 445,835" stroke-width="5" />
    <path d="M 980,210 C 910,280 810,350 690,410" stroke-width="3.5" />
    <!-- Blackwater Fork -->
    <path d="M 1180,240 C 1140,380 1060,490 960,610 C 900,680 880,760 870,835" stroke-width="4" />
  </g>

  <!-- Mountain Ranges (Northern Ironpeaks) -->
  <g stroke="#4a3720" stroke-width="2.2" fill="#cbb086">
    <polygon points="320,190 355,120 390,190" />
    <polygon points="365,200 410,110 455,200" />
    <polygon points="430,195 470,130 510,195" />
    <polygon points="620,185 665,100 710,185" />
    <polygon points="680,195 730,115 780,195" />
    <polygon points="750,190 795,125 840,190" />
    <polygon points="990,195 1040,105 1090,195" />
    <polygon points="1055,205 1110,115 1165,205" />
    <polygon points="1130,195 1180,125 1230,195" />
    <polygon points="1260,220 1315,130 1370,220" />
    <polygon points="1335,235 1385,155 1435,235" />
  </g>
  <!-- Mountain Snow Caps -->
  <g fill="#f8fafc" fill-opacity="0.75">
    <polygon points="355,120 342,146 355,140 368,146" />
    <polygon points="410,110 394,142 410,135 426,142" />
    <polygon points="665,100 648,134 665,126 682,134" />
    <polygon points="730,115 714,146 730,139 746,146" />
    <polygon points="1040,105 1022,140 1040,132 1058,140" />
    <polygon points="1110,115 1092,150 1110,141 1128,150" />
    <polygon points="1315,130 1297,164 1315,156 1333,164" />
  </g>

  <!-- Forest Clusters (Whispering Woods) -->
  <g fill="#3f6212" fill-opacity="0.55" stroke="#2ec4b6" stroke-width="0">
    <circle cx="540" cy="390" r="18" /><circle cx="565" cy="380" r="22" /><circle cx="590" cy="395" r="17" />
    <circle cx="620" cy="360" r="20" /><circle cx="650" cy="375" r="24" /><circle cx="610" cy="420" r="19" />
    <circle cx="740" cy="390" r="22" /><circle cx="770" cy="410" r="25" /><circle cx="805" cy="395" r="18" />
    <circle cx="780" cy="450" r="21" /><circle cx="820" cy="465" r="19" /><circle cx="850" cy="440" r="22" />
    <circle cx="550" cy="480" r="20" /><circle cx="585" cy="495" r="23" /><circle cx="620" cy="485" r="18" />
  </g>

  <!-- Imperial Trade Roads & Caravan Trails -->
  <g fill="none" stroke="#78350f" stroke-width="3" stroke-dasharray="10,7" stroke-opacity="0.75">
    <!-- Coastal King's Road -->
    <path d="M 380,620 C 440,560 490,520 580,490 C 670,460 760,490 880,520 C 1000,550 1140,510 1270,460" />
    <!-- Northern Citadel Pass -->
    <path d="M 580,490 C 590,390 640,290 700,210" />
    <!-- Sunken Marsh Causeway -->
    <path d="M 580,490 C 540,600 500,690 460,780" />
    <!-- Eastern Frontier Trail -->
    <path d="M 880,520 C 940,620 960,700 940,780" />
  </g>

  <!-- Map Region Labels (Cartographic Serif Typography) -->
  <g font-family="Cinzel, Georgia, serif" fill="#3d2b14" text-anchor="middle" opacity="0.78">
    <text x="720" y="155" font-size="22" font-weight="bold" letter-spacing="6">THE IRONPEAK MOUNTAINS</text>
    <text x="690" y="445" font-size="20" font-weight="bold" letter-spacing="5" fill="#274010">THE WHISPERING WOODS</text>
    <text x="1180" y="390" font-size="18" font-style="italic" letter-spacing="4">ASHEN MOORS OF Vael</text>
    <text x="860" y="755" font-size="16" font-weight="bold" letter-spacing="4" fill="#134e4a">THE SUNKEN FENLANDS</text>
    <text x="390" y="545" font-size="18" font-weight="bold" letter-spacing="3">CROWNLANDS OF OAKHAVEN</text>
    <text x="230" y="915" font-size="22" font-style="italic" letter-spacing="7" fill="#94a3b8" opacity="0.65">THE SHATTERED SEA</text>
  </g>

  <!-- Compass Rose (Bottom Left Sea) -->
  <g transform="translate(220, 780)">
    <circle cx="0" cy="0" r="62" fill="#0f172a" fill-opacity="0.6" stroke="#d97706" stroke-width="2" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4" />
    <polygon points="0,-75 12,-14 0,-24 -12,-14" fill="#f59e0b" />
    <polygon points="0,75 10,14 0,24 -10,14" fill="#cbd5e1" />
    <polygon points="75,0 14,10 24,0 14,-10" fill="#cbd5e1" />
    <polygon points="-75,0 -14,10 -24,0 -14,-10" fill="#cbd5e1" />
    <circle cx="0" cy="0" r="8" fill="#f59e0b" stroke="#0f172a" stroke-width="2" />
    <text x="0" y="-82" font-family="Cinzel, serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">N</text>
  </g>

  <!-- Decorative Cartouche Frame & Scale Bar (Bottom Right) -->
  <g transform="translate(1220, 860)">
    <rect x="0" y="0" width="320" height="90" rx="10" fill="#1e293b" fill-opacity="0.88" stroke="#d97706" stroke-width="2" />
    <text x="160" y="30" font-family="Cinzel, Georgia, serif" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="2">REALM OF THE SHATTERED COAST</text>
    <line x1="40" y1="52" x2="280" y2="52" stroke="#e2e8f0" stroke-width="3" />
    <line x1="40" y1="45" x2="40" y2="59" stroke="#e2e8f0" stroke-width="2" />
    <line x1="100" y1="47" x2="100" y2="57" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="160" y1="45" x2="160" y2="59" stroke="#e2e8f0" stroke-width="2" />
    <line x1="280" y1="45" x2="280" y2="59" stroke="#e2e8f0" stroke-width="2" />
    <text x="40" y="74" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">0</text>
    <text x="100" y="74" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">24 mi</text>
    <text x="160" y="74" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">48 mi</text>
    <text x="280" y="74" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">96 miles (1 Hex = 24 mi)</text>
  </g>

  <!-- Outer Map Border -->
  <rect x="12" y="12" width="1576" height="976" fill="none" stroke="#d97706" stroke-width="4" rx="8" />
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.6" rx="4" />
</svg>
