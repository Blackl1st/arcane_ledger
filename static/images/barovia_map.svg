<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <!-- Gothic Atmosphere Gradients -->
    <radialGradient id="mistVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141c26" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#0d131a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#040608" stop-opacity="0.98" />
    </radialGradient>

    <linearGradient id="valleyParchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2833" />
      <stop offset="35%" stop-color="#18202a" />
      <stop offset="70%" stop-color="#121820" />
      <stop offset="100%" stop-color="#0b0f14" />
    </linearGradient>

    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4957" />
      <stop offset="60%" stop-color="#242c35" />
      <stop offset="100%" stop-color="#161c22" />
    </linearGradient>

    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a4c" />
      <stop offset="100%" stop-color="#0f1f2a" />
    </linearGradient>

    <filter id="gothicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gothicHex" width="80" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 40 0 L 20 34.641 L 40 69.282 L 80 69.282 M 0 34.641 L 20 34.641" fill="none" stroke="#e0a96d" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- 1. Deep Valley Background -->
  <rect width="1600" height="1000" fill="url(#valleyParchment)" />

  <!-- 2. Hex Grid Sub-layer -->
  <rect width="1600" height="1000" fill="url(#gothicHex)" />

  <!-- 3. Balinok Mountains Range (North & South Ridges) -->
  <!-- Mount Baratok Ridge (North) -->
  <path d="M 120 180 L 260 90 L 380 140 L 520 80 L 640 120 L 780 70 L 910 110 L 1050 60 L 1200 110 L 1360 80 L 1520 160 L 1600 240 L 1600 0 L 0 0 L 0 240 Z" fill="url(#mountainGrad)" opacity="0.85" />
  
  <!-- Mount Ghakis Ridge (South) -->
  <path d="M 0 840 L 180 890 L 320 820 L 480 880 L 620 810 L 780 870 L 920 830 L 1080 900 L 1240 840 L 1400 910 L 1600 850 L 1600 1000 L 0 1000 Z" fill="url(#mountainGrad)" opacity="0.9" />

  <!-- Mountain Shading / Ridges -->
  <g stroke="#566573" stroke-width="1.5" opacity="0.4" fill="none">
    <!-- North Peaks -->
    <path d="M 520 80 L 540 140 M 780 70 L 800 130 M 1050 60 L 1070 120 M 380 140 L 400 190" />
    <path d="M 750 90 L 780 70 L 820 100" />
    <path d="M 480 100 L 520 80 L 560 110" />
    <!-- South Peaks -->
    <path d="M 620 810 L 640 760 M 780 870 L 800 810 M 920 830 L 940 780" />
    <path d="M 580 830 L 620 810 L 660 840" />
  </g>

  <!-- 4. Dense Svalich Forests (Dark Woodlands) -->
  <g fill="#111c19" opacity="0.65">
    <!-- Western Svalich Woods -->
    <ellipse cx="320" cy="460" rx="180" ry="140" />
    <ellipse cx="440" cy="520" rx="140" ry="100" />
    <!-- Eastern Svalich Woods -->
    <ellipse cx="1120" cy="500" rx="200" ry="150" />
    <ellipse cx="1280" cy="540" rx="160" ry="120" />
    <!-- South Svalich Woods -->
    <ellipse cx="720" cy="660" rx="220" ry="110" />
  </g>

  <!-- 5. Major Lakes & Water Bodies -->
  <!-- Lake Zarovich -->
  <path d="M 660 320 C 720 300, 820 310, 880 340 C 850 370, 780 380, 720 370 C 680 365, 650 340, 660 320 Z" fill="url(#lakeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#gothicGlow)" />
  
  <!-- Lake Baratok -->
  <path d="M 480 310 C 520 290, 570 300, 590 330 C 580 350, 530 360, 490 350 C 470 340, 470 320, 480 310 Z" fill="url(#lakeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

  <!-- Tser Pool -->
  <ellipse cx="1080" cy="570" rx="45" ry="30" fill="url(#lakeGrad)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- 6. Rivers (Ivlis & Luna) -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round">
    <!-- River Ivlis (Originates at Tser Pool / Castle, flows East past Village to Gate) -->
    <path d="M 1080 570 Q 1150 590 1220 595 T 1320 610 T 1480 620" />
    <!-- River Ivlis Northern Fork -->
    <path d="M 1050 490 Q 1070 530 1080 570" stroke-dasharray="3,3" stroke-width="1.5" />
    
    <!-- Luna River (Flows South from Lake Zarovich past Berez) -->
    <path d="M 720 370 Q 710 480 690 560 T 670 700 T 690 820" />
    <!-- Western Tributary near Winery -->
    <path d="M 400 660 Q 520 670 670 700" stroke-width="1.8" />
  </g>

  <!-- 7. The Old Svalich Road (Main Arterial Highway) -->
  <!-- Road Casing / Shadow -->
  <path d="M 120 330 Q 240 320 340 350 T 540 390 T 750 420 T 920 460 T 1070 540 T 1180 580 T 1300 605 T 1480 610" fill="none" stroke="#000000" stroke-width="5" opacity="0.6" stroke-linecap="round" />
  <!-- Road Inner Trail -->
  <path d="M 120 330 Q 240 320 340 350 T 540 390 T 750 420 T 920 460 T 1070 540 T 1180 580 T 1300 605 T 1480 610" fill="none" stroke="#d4a373" stroke-width="2" stroke-dasharray="8,4" stroke-linecap="round" />

  <!-- Secondary Mountain Roads & Byways -->
  <g stroke="#a68a68" stroke-width="1.2" stroke-dasharray="4,4" fill="none" opacity="0.55">
    <!-- Road up to Castle Ravenloft Pillar -->
    <path d="M 1070 540 Q 1080 490 1090 460" />
    <!-- Road to Old Bonegrinder Hill -->
    <path d="M 920 460 Q 915 480 912 490" />
    <!-- Road South to Argynvostholt & Tsolenka Pass -->
    <path d="M 750 420 Q 700 520 660 610 T 600 760 T 610 860" />
    <!-- Road Southwest to Wizard of Wines & Yester Hill -->
    <path d="M 340 350 Q 360 520 400 680 T 300 840" />
    <!-- Road to Werewolf Den in Mountains -->
    <path d="M 280 325 Q 260 260 240 210" />
  </g>

  <!-- 8. Geographic Landmarks Cartographic Callouts -->
  <g font-family="Georgia, serif" fill="#e0a96d" opacity="0.85">
    <!-- North Mountains -->
    <text x="640" y="160" font-size="13" font-style="italic" letter-spacing="3" text-anchor="middle">MOUNT BARATOK</text>
    <!-- South Mountains -->
    <text x="620" y="910" font-size="13" font-style="italic" letter-spacing="3" text-anchor="middle">MOUNT GHAKIS</text>
    <!-- Forests -->
    <text x="320" y="470" font-size="11" font-style="italic" fill="#8899a6" letter-spacing="2" text-anchor="middle">SVALICH WOODS</text>
    <text x="1200" y="510" font-size="11" font-style="italic" fill="#8899a6" letter-spacing="2" text-anchor="middle">EASTERN SVALICH WOODS</text>
    <!-- Lakes -->
    <text x="760" y="345" font-size="11" font-weight="bold" fill="#7dd3fc" letter-spacing="1.5" text-anchor="middle">LAKE ZAROVICH</text>
    <text x="530" y="335" font-size="9" fill="#7dd3fc" letter-spacing="1" text-anchor="middle">LAKE BARATOK</text>
    <!-- Roads -->
    <text x="1380" y="625" font-size="9" font-style="italic" fill="#d4a373" letter-spacing="1">Old Svalich Road &gt;</text>
  </g>

  <!-- 9. Gothic Compass Rose -->
  <g transform="translate(1450, 160)" opacity="0.75">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#e0a96d" stroke-width="1" stroke-dasharray="2,3" />
    <circle cx="0" cy="0" r="38" fill="#0d131a" stroke="#881337" stroke-width="1.5" />
    <!-- Points -->
    <polygon points="0,-42 7,-8 0,0 -7,-8" fill="#e0a96d" />
    <polygon points="0,42 7,8 0,0 -7,8" fill="#5c4728" />
    <polygon points="42,0 8,7 0,0 8,-7" fill="#5c4728" />
    <polygon points="-42,0 -8,7 0,0 -8,-7" fill="#5c4728" />
    <!-- Cardinals -->
    <text x="0" y="-46" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#fcd34d" text-anchor="middle">N</text>
    <text x="0" y="57" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#a88b5e" text-anchor="middle">S</text>
    <text x="52" y="4" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#a88b5e" text-anchor="middle">E</text>
    <text x="-52" y="4" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#a88b5e" text-anchor="middle">W</text>
  </g>

  <!-- 10. Dread Mist Borders (Poisonous Fog Encirclement) -->
  <rect width="1600" height="1000" fill="url(#mistVignette)" pointer-events="none" />

  <!-- 11. Ornate Border Frame -->
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#e0a96d" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="26" y="26" width="1548" height="948" fill="none" stroke="#881337" stroke-width="1" stroke-opacity="0.5" />

  <!-- Title Banner -->
  <g transform="translate(800, 60)" text-anchor="middle">
    <rect x="-240" y="-30" width="480" height="50" rx="8" fill="#0d131a" stroke="#881337" stroke-width="1.5" opacity="0.9" />
    <text y="-2" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#fcd34d" letter-spacing="4">THE LANDS OF BAROVIA</text>
    <text y="14" font-family="sans-serif" font-size="9" font-mono="true" fill="#94a3b8" letter-spacing="2">DOMAINS OF DREAD • 1 HEX = 1/4 MILE</text>
  </g>
</svg>
